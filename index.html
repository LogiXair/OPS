<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LogiXair Vector Twin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one full-bleed 3D scene; console panels dock to its edges (command bar on top, KPIs top-left,
   detail right, tracker bottom-left, tables along the bottom). On a phone the panels fold into a bottom sheet. */
:root{
  --bg:#0B0D10; --panel:#101317; --panel-2:#181C22; --line:#262A31; --line-2:#3A4049;
  --fg:#E9EAEC; --fg-2:#C8CDD4; --mute:#939BA5; --dim:#6A717B;
  --accent:#E8523F; --ok:#3DDC97; --warn:#FAC83C; --info:#78AAFF; --mx:#C08CF0; --hot:#FF8874;
  --display:Archivo,Helvetica,Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --glass:rgba(13,16,20,.84); --pad:12px; --bar:46px; --sub:34px; --right:324px; --bottom:232px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font:500 13px/1.4 var(--display);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{position:absolute;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#veil{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .34s ease;z-index:5}
#veil.on{opacity:1}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mono{font-family:var(--mono)}
.cap{font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}

/* ---- 3D labels ---- */
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 10px/1 var(--mono);letter-spacing:.06em;color:var(--fg-2);margin-top:-6px;will-change:transform;text-shadow:0 0 3px #07090C,0 0 6px #07090C}
.lbl.city{color:#AEB5BE;font-family:var(--display);font-size:11px;letter-spacing:.01em}
.lbl.city.t0{color:var(--fg);font-size:12.5px;font-weight:600}
.lbl.city.t2{font-size:10px;color:#8E96A0}
.lbl.grat{color:var(--dim);font-size:9px}
.lbl.apt{color:var(--hot);font-size:9px}
.lbl.aux{color:#9FD8FF;font-size:9px}
.lbl.aux.cont{color:var(--warn)}
.lbl.route{color:var(--bg);background:var(--fg);padding:3px 5px;font-weight:700;font-size:9.5px;text-shadow:none;margin-top:-8px}
.lbl.ac{color:var(--fg);font-size:9.5px;margin-left:-22px}
.lbl.ac.sel{color:var(--bg);background:var(--accent);padding:3px 5px;font-weight:700;text-shadow:none}
.lbl.site{margin-top:-14px;background:rgba(11,13,16,.82);border:1px solid #2F353E;padding:5px 8px;text-shadow:none}
.lbl.site b{display:block;font:800 12.5px/1.1 var(--display);letter-spacing:-.005em;color:#F4F4F2}
.lbl.site i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.14em;color:var(--mute);margin-top:3px}
.lbl.site.far{margin-top:-10px;padding:3px 6px}.lbl.site.far b{font-size:11px;font-weight:700}.lbl.site.far i{display:none}.lbl.site.base.far b{font-size:12px;font-weight:800}.lbl.site.base.far{border-color:#59626E}
.lbl.site.dim{background:none;border:0;padding:0;margin-top:-6px}
.lbl.site.dim b{font-size:10.5px;font-weight:600;color:#8E96A0}.lbl.site.dim i{display:none}
.lbl.actag{color:var(--fg);font-size:9.5px;background:rgba(11,13,16,.74);padding:3px 6px;text-shadow:none;margin-top:-8px;margin-left:-40px}
.lbl.actag b{font-weight:700;color:#fff}.lbl.actag.sel{background:var(--accent);color:var(--bg)}.lbl.actag.sel b{color:var(--bg)}
.lbl.pad{font-size:9px;background:rgba(11,13,16,.74);padding:3px 5px;text-shadow:none;margin-top:-8px}
.lbl.pad b{color:#fff}.lbl.pad s{text-decoration:none;color:var(--fg-2)}.lbl.pad s.ok{color:var(--ok)}.lbl.pad s.warn{color:var(--warn)}
.lbl.asset{margin-top:-14px;border-left:2px solid var(--accent);background:rgba(11,13,16,.8);padding:4px 8px;text-shadow:none}
.lbl.asset b{display:block;font:800 12px/1.1 var(--display);color:#F4F4F2;letter-spacing:0}
.lbl.asset i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.12em;color:var(--mute);margin-top:3px}

/* ---- panels ---- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);border:1px solid var(--line)}
#bar{position:absolute;left:0;right:0;top:0;height:calc(var(--bar) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;gap:16px;border-width:0 0 1px;z-index:4}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand img{height:19px;width:auto;display:block;opacity:.96}
.brand span{font:500 10.5px/1 var(--mono);letter-spacing:.2em;color:var(--accent);padding-left:11px;border-left:1px solid var(--line-2)}
.tabs{display:flex;gap:2px;flex:0 0 auto;min-width:0}
.tab{padding:7px 12px 6px;border:1px solid transparent;text-align:left;white-space:nowrap;display:flex;flex-direction:column;gap:3px}
.tab b{font:800 12.5px/1 var(--display);letter-spacing:-.005em;color:var(--fg-2)}
.tab i{font:500 8.5px/1 var(--mono);font-style:normal;letter-spacing:.14em;color:var(--dim)}
.tab:hover b{color:#fff}
.tab.on{background:var(--panel-2);border-color:var(--line-2)}
.tab.on b{color:#fff}.tab.on i{color:var(--sc,var(--accent))}
.grow{flex:1 1 0;min-width:0}
#bar>.grow{flex:1 100 0}
#search{position:relative;flex:1 1 120px;max-width:230px;min-width:80px}
#q{width:100%;height:28px;background:var(--panel-2);border:1px solid var(--line);padding:0 9px;font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--fg);border-radius:0}
#q::placeholder{color:var(--dim)}
#qres{position:absolute;left:0;right:0;top:31px;max-height:280px;overflow:auto;z-index:9}
#qres button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:7px 9px;font:500 11px/1.2 var(--mono);text-align:left;border-bottom:1px solid var(--line)}
#qres button:hover,#qres button.hi{background:var(--panel-2)}
#qres button span{color:var(--mute);font-size:9.5px;letter-spacing:.1em}
.clock{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.clock b{font:700 15px/1 var(--mono);letter-spacing:.02em}
.clock i{font:500 9px/1 var(--mono);font-style:normal;letter-spacing:.14em;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:6px 8px;font:500 10px/1 var(--mono);letter-spacing:.06em;color:var(--mute);border-right:1px solid var(--line);min-width:30px}
.seg button:last-child{border-right:0}
.seg button:hover{color:#fff}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:700}
.chip{padding:6px 9px;font:500 9.5px/1 var(--mono);letter-spacing:.12em;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--fg-2);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;flex:0 0 auto}
.dot.pulse{animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

#sub{position:absolute;left:0;right:0;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:var(--sub);padding:0 14px;display:flex;align-items:center;gap:12px;border-width:0 0 1px;z-index:3;background:rgba(11,13,16,.66)}
.crumb{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--mono);letter-spacing:.12em;color:var(--mute);white-space:nowrap}
.crumb button{color:var(--fg-2);letter-spacing:.12em}.crumb button:hover{color:#fff}
.crumb b{color:#fff;font-weight:700}
.areas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);padding-right:30px}
.areas::-webkit-scrollbar{display:none}
.areas button{padding:5px 9px;font:500 9.5px/1 var(--mono);letter-spacing:.08em;color:var(--fg-2);border:1px solid var(--line);white-space:nowrap}
.areas button:hover{border-color:var(--fg-2);color:#fff}
.areas button.base{border-color:var(--line-2);color:#fff}
.ctl{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ctl .cap{font-size:8.5px}

/* KPIs */
#kpi{position:absolute;left:var(--pad);top:calc(var(--bar) + var(--sub) + var(--pad) + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:2}
.k{width:172px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:8px}
.k b{font:800 25px/1 var(--display);letter-spacing:-.03em;color:#fff}
.k b small{font:600 12px/1 var(--display);color:var(--mute);letter-spacing:0;margin-left:3px}
.k p{margin:0;font:500 9.5px/1.45 var(--mono);letter-spacing:.02em;color:var(--fg-2);white-space:nowrap}
.meter{height:3px;background:var(--line);position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--fg)}

/* right detail */
#detail{position:absolute;right:var(--pad);top:calc(var(--bar) + var(--sub) + var(--pad) + env(safe-area-inset-top,0px));bottom:calc(var(--bottom) + var(--pad) * 2);width:var(--right);display:flex;flex-direction:column;z-index:2;min-height:0}
.dh{padding:13px 14px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.dh h2{margin:0;font:800 21px/1.05 var(--display);letter-spacing:-.025em;color:#fff;text-wrap:balance}
.dh .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.db{padding:12px 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.db p{margin:0;font-size:12.5px;line-height:1.5;color:var(--fg-2);text-wrap:pretty}
.pill{display:inline-block;padding:3px 7px;font:700 9px/1 var(--mono);letter-spacing:.1em;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.info{color:var(--info)}.pill.mx{color:var(--mx)}.pill.hot{color:var(--hot)}.pill.mute{color:var(--mute)}
.pill.fill{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.grid.two{grid-template-columns:repeat(2,1fr)}
.cell{background:var(--panel);padding:8px 9px 9px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cell b{font:700 14px/1 var(--mono);color:#fff;white-space:nowrap}
.cell b small{font:500 9px/1 var(--mono);color:var(--mute);margin-left:3px}
.kv{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font:500 10.5px/1.3 var(--mono);color:var(--fg-2)}
.kv div span:first-child{color:var(--mute);letter-spacing:.08em;font-size:9.5px;white-space:nowrap}
.kv div span:last-child{text-align:right;color:var(--fg)}
.bar{display:flex;flex-direction:column;gap:5px}
.bar .row{display:flex;justify-content:space-between;font:500 9.5px/1 var(--mono);letter-spacing:.08em;color:var(--mute)}
.bar .row b{color:#fff;font-weight:700}
.btn{display:block;width:100%;padding:11px 12px;font:700 10.5px/1 var(--mono);letter-spacing:.12em;text-align:center;background:var(--accent);color:var(--bg)}
.btn:hover{background:#fff}
.btn.ghost{background:none;border:1px solid var(--line-2);color:var(--fg)}
.btn.ghost:hover{border-color:#fff;background:none}
.btns{display:flex;gap:6px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
table.dt{width:100%;border-collapse:collapse;font:500 10px/1.2 var(--mono);margin-top:7px}
table.dt th{position:static;background:none;font-weight:500;color:var(--mute);font-size:8.5px;letter-spacing:.12em;text-align:right;padding:5px 0 5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{text-align:right;padding:5px 0 5px 6px;border-bottom:1px solid var(--line);color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left;padding-left:0;color:var(--mute);font-size:9px;letter-spacing:.06em;white-space:normal}
table.dt td.w{color:#fff}table.dt tr.tot td{color:#fff;font-weight:700}
.list button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font:500 10.5px/1.2 var(--mono);color:var(--fg-2);text-align:left;width:100%}
.list button:hover{color:#fff}
.list button span:last-child{color:var(--mute);font-size:9.5px;white-space:nowrap}
.src{font:500 9px/1.5 var(--mono);letter-spacing:.04em;color:var(--dim)}
svg.box text{font:500 8px var(--mono);fill:var(--mute)}

/* tracker */
#track{position:absolute;left:var(--pad);bottom:var(--pad);width:404px;height:var(--bottom);padding:12px 14px 12px;display:flex;flex-direction:column;gap:9px;z-index:2}
#track h3{margin:0;font:800 17px/1 var(--display);letter-spacing:-.02em;color:#fff}
.steps{display:grid;grid-template-columns:repeat(6,1fr);position:relative;margin-top:2px}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;padding-right:4px;min-width:0}
.st:before{content:"";position:absolute;left:11px;right:-1px;top:5px;height:1px;background:var(--line-2)}
.st:last-child:before{display:none}
.st u{width:11px;height:11px;border:1px solid var(--line-2);background:var(--panel);position:relative;z-index:1;text-decoration:none;display:block}
.st.done u{background:var(--fg);border-color:var(--fg)}.st.done:before{background:var(--fg)}
.st.now u{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,82,63,.25)}
.st em{font:700 8.5px/1.15 var(--mono);font-style:normal;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.st.now em,.st.done em{color:#fff}
.st s{font:500 9.5px/1 var(--mono);text-decoration:none;color:var(--mute)}
.st.now s{color:var(--accent)}
.tr-meta{display:flex;gap:14px;flex-wrap:wrap;font:500 10px/1.2 var(--mono);color:var(--fg-2);margin-top:auto;padding-top:9px;border-top:1px solid var(--line)}
.tr-meta span b{color:#fff}

/* tables */
#tables{position:absolute;left:calc(404px + var(--pad) * 2);right:var(--pad);bottom:var(--pad);height:var(--bottom);display:flex;flex-direction:column;z-index:2;min-width:0}
.tt{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:0 0 auto}
.tt button{padding:10px 13px 9px;font:500 10px/1 var(--mono);letter-spacing:.12em;color:var(--mute);border-right:1px solid var(--line);white-space:nowrap}
.tt button:hover{color:#fff}
.tt button.on{color:var(--bg);background:var(--fg);font-weight:700}
.tt .grow{display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font:500 9px/1 var(--mono);letter-spacing:.1em;color:var(--dim);white-space:nowrap;overflow:hidden}
.tw{overflow:auto;flex:1 1 0;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
table{border-collapse:collapse;width:100%;font:500 10.5px/1.2 var(--mono);font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#12151A;text-align:left;padding:7px 10px;font:500 8.5px/1 var(--mono);letter-spacing:.14em;color:var(--mute);white-space:nowrap;border-bottom:1px solid var(--line);z-index:1}
td{padding:6px 10px;border-bottom:1px solid rgba(38,42,49,.7);white-space:nowrap;color:var(--fg-2)}
td.w{color:#fff;font-weight:700}
td.r,th.r{text-align:right}
td.wrap{white-space:normal;min-width:240px}
tr.c{cursor:pointer}
tr.c:hover td{background:rgba(255,255,255,.04)}
tr.sel td{background:rgba(232,82,63,.14)}
.prog{display:inline-block;width:64px;height:3px;background:var(--line);vertical-align:middle;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--fg)}
.pd{display:inline-block;width:8px;height:8px;margin-right:3px;border:1px solid var(--line-2)}
.pd.o{background:var(--hot);border-color:var(--hot)}.pd.r{background:var(--warn);border-color:var(--warn)}.pd.f{border-color:var(--ok)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-info{color:var(--info)}.c-mx{color:var(--mx)}.c-hot{color:var(--hot)}.c-mute{color:var(--mute)}

#hint{position:absolute;left:calc((100% - var(--right)) / 2);bottom:calc(var(--bottom) + var(--pad) * 2 + 4px);transform:translateX(-50%);font:500 9.5px/1 var(--mono);letter-spacing:.1em;color:var(--mute);pointer-events:none;white-space:nowrap;text-shadow:0 0 4px #000;z-index:1}
#scale{position:absolute;right:calc(var(--right) + var(--pad) * 2);top:calc(var(--bar) + var(--sub) + var(--pad) + env(safe-area-inset-top,0px));font:500 9px/1 var(--mono);letter-spacing:.1em;color:var(--fg-2);display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none;z-index:1;text-shadow:0 0 4px #000}
#scale i{display:block;height:5px;border:1px solid var(--fg-2);border-top:0}

/* feed / about drawer */
#feed{position:absolute;right:var(--pad);top:calc(var(--bar) + var(--sub) + var(--pad) + env(safe-area-inset-top,0px));bottom:var(--pad);width:min(520px,calc(100% - var(--pad) * 2));z-index:8;display:flex;flex-direction:column;min-height:0}
#ops{position:absolute;left:var(--pad);right:var(--pad);top:calc(var(--bar) + var(--sub) + var(--pad) + env(safe-area-inset-top,0px));bottom:var(--pad);z-index:9;display:flex;flex-direction:column;min-height:0;background:rgba(11,13,16,.96)}
#ops .oh{padding:13px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
#ops .oh .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ops .oh h2{margin:0;font:800 24px/1.05 var(--display);letter-spacing:-.025em;color:#fff}
#ops .otabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
#ops .ob{padding:14px 16px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1 1 0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#ops .ob p{margin:0;font-size:12px;line-height:1.5;color:var(--fg-2)}
#ops .ogrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
#ops .ogrid .cell b{font-size:19px}#ops .ogrid .cell p{font:500 9.5px/1.35 var(--mono);color:var(--mute)}
#ops .ocols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px}
#ops table.ot th{position:sticky;top:-14px}
#ops table.ot td{white-space:nowrap}#ops table.ot td.wrap{white-space:normal;min-width:260px;line-height:1.5}#ops table.ot tr.tot td{color:#fff;font-weight:700;border-top:1px solid var(--line-2)}
#ops table.ot tr.day td{color:var(--warn);background:rgba(250,200,60,.06);font-weight:600}
#ops table.ot tr.live td{color:var(--fg)}
#ops .lnk{color:#fff;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;font:inherit}
#ops .lnk:hover{text-decoration-color:#fff}
#ops .ochips{display:flex;flex-wrap:wrap;gap:4px}
#ops .ochips button{padding:5px 9px;font:500 9.5px/1 var(--mono);letter-spacing:.08em;color:var(--fg-2);border:1px solid var(--line)}
#ops .ochips button.on{color:var(--bg);background:var(--fg);border-color:var(--fg)}

  #feed{left:0;right:0;top:calc(var(--bar) + env(safe-area-inset-top,0px));bottom:0;width:auto;border-width:0}
}

/* ===== 10-world.js ===== */
/* ============================================================================
   WORLD CONFIG — the one block to edit when real routes, sites or numbers change.
   Every value carries where it came from:
     [thesis]  thesis.logixair.com (DOC LX-001 rev 6.0)
     [conops]  LogiXair Regulatory Framework & ConOps
     [vector]  LogiXair Vector consoles (vector-core.js)
     [mro]     LogiXair MRO calculator
     [model]   modelling assumption made for this twin, not a LogiXair figure
   ========================================================================== */

const L560 = {
  payloadKg: 300,        // [thesis]
  rangeKm: 600,          // [thesis]
  mtowKg: 1350,          // [conops]
  cruiseKmh: 250,        // [conops]
  footprintM: [7, 5],    // [thesis]
  rotors: '6+2',         // [thesis] 4 on the front tilt-wing, 2 on the rear, 2 fixed on the centreline (Fig. 01)
  // [model] flight-profile values the documents do not state
  hoverAltM: 45, liftMs: 2.5, landMs: 1.8, transSpeedMs: 50, transOutS: 26, transInS: 34,
  climbMs: 5.0, accelMs2: 0.6, bankDeg: 25, reservePct: 20
};

const CORRIDOR = {
  halfWidthM: 500,       // [conops] lateral box ±500 m
  floorFt: 1000,         // [conops]
  ceilFt: 6000,          // [conops]
  baseLevelFt: 2200,     // [conops] operating 2,200-2,500 ft
  sepVertFt: 200,        // [vector] vertical minimum
  sepTrailKm: 3.0,       // [vector] longitudinal minimum
  holdRadiusKm: 1.2,     // [vector] hold = 1.2 km orbit
  pilotMax: 15,          // [vector] aircraft per supervisory pilot
  groundLinkKm: 90       // [model] ground C2 reach before SATCOM backup takes over
};

/* Pod and pallet standard. Two pallets per pod is LogiXair's figure; the EUR 1200 x 800 mm footprint is [model]. */
/* Pod: 2.10 x 1.75 x 1.75 m outside, two pallets in tandem [LogiXair]. EUR footprint, wall allowance and load height are [model]. */
const POD = { pallets: 2, palletMm: [1200, 800], lenM: 2.10, widthM: 1.75, heightM: 1.75, loadHm: 1.45 };
const PODY = 0.60;                // pod underside above ground on the aircraft [model]
const AIRFRAME_DY = PODY + POD.heightM - 1.50;   // airframe raised so the pod top meets the spine
const PALLET_M3 = POD.palletMm[0] * POD.palletMm[1] / 1e6 * POD.loadHm;
/* Dock reporting splits cargo in two: wet = temperature-controlled or liquid; everything else moves as dry [model]. */
const WET_TYPES = { COLD: 1, LIQ: 1 };
/* Pod loading at the truck dock, seconds of simulated time [model]: vehicle in, one forklift cycle per pallet, vehicle out. */
const DOCK = { vIn: 52, move: 44, vOut: 50 };
const MX = { basicFh: 175, fullFh: 850, lifeFh: 20000, basicDurS: 3 * 3600 };  // [mro]; duration [model]

/* Tariff, rupees per kg per km [LogiXair]: wet = cold chain and liquid pods, everything else dry.
   Billed on the great-circle distance between the two sites at delivery [model]; maintenance ferries and empty legs earn nothing. */
const TARIFF = { DRY: 0.10, WET: 0.18 };
/* Demand: share of each line's roster wanted in the air, hour by hour (IST) [model] — a peak from 10:00 to 15:00,
   a long evening taper and a thin night service. Airframes not needed stand down wherever their last leg ended:
   in the base line hangar (limited slots), on a stand, or on an outstation's night stand. No positioning legs. */
const DEMAND = [0.15, 0.13, 0.12, 0.12, 0.15, 0.24, 0.38, 0.52, 0.66, 0.8, 0.95, 0.97, 0.97, 0.96, 0.94, 0.82, 0.7, 0.6, 0.5, 0.42, 0.34, 0.27, 0.21, 0.17];
/* offshore flies in daylight only; the navy runs a steady round-the-clock service */
const DEMAND_OF = [0, 0, 0, 0, 0, 0.04, 0.5, 0.85, 0.95, 0.97, 0.97, 0.97, 0.97, 0.97, 0.95, 0.92, 0.85, 0.6, 0.2, 0, 0, 0, 0, 0];
const DEMAND_NV = [0.4, 0.4, 0.4, 0.4, 0.4, 0.5, 0.6, 0.8, 0.9, 1, 1, 1, 1, 1, 1, 0.9, 0.8, 0.7, 0.6, 0.6, 0.5, 0.5, 0.4, 0.4];
const demandAt = (t, scn) => { const D = scn === 'OF' ? DEMAND_OF : scn === 'NV' ? DEMAND_NV : DEMAND, h = ((t / 3600) % 24 + 24) % 24, i = Math.floor(h), f = h - i; return D[i] * (1 - f) + D[(i + 1) % 24] * f; };
/* Each rest includes the daily inspection; a duty runs at most maxFh before the airframe must stand down [model]. */
/* A check due within mxWindowFh is pulled forward and done overnight: at the MRO hub when it is close to the base (mroNearKm), else in the base line hangar [model]. */
const DUTY = { maxFh: 12, minRestS: 4 * 3600, minDutyFh: 1.5, mxWindowFh: 50, mroNearKm: 80, lineCheckS: 2.5 * 3600 };

/* ---------- maths, geodesy and formatting helpers ---------- */
const DEG = Math.PI / 180, FT = 0.3048, KT = 0.514444;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* the simulation's own generator: same sequence as mulberry32, with its state exposed so a snapshot can resume it */
function seededRng(seed) {
  const st = { a: seed >>> 0 };
  const f = function () {
    let a = st.a | 0; a = a + 0x6D2B79F5 | 0; st.a = a;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  f.state = st; return f;
}
/* operating days run 06:00 to 06:00 IST; day 1 began on 12 Oct 2026 */
const DAY1 = { y: 2026, m: 9, d: 12 };
const dayOf = t => Math.floor((t - 6 * 3600) / 86400) + 1;
const dateOf = t => { const d = new Date(Date.UTC(DAY1.y, DAY1.m, DAY1.d) + Math.floor(t / 86400) * 86400000); return d.getUTCDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()]; };
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const KM_LAT = 110.574, KM_LON = 111.320;
/* great-circle distance, km */
function distKm(lat1, lon1, lat2, lon2) {
  const p1 = lat1 * DEG, p2 = lat2 * DEG, dp = p2 - p1, dl = (lon2 - lon1) * DEG;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 12742.02 * Math.asin(Math.min(1, Math.sqrt(h)));
}
/* initial bearing, degrees clockwise from north */
function bearing(lat1, lon1, lat2, lon2) {
  const p1 = lat1 * DEG, p2 = lat2 * DEG, dl = (lon2 - lon1) * DEG;
  const y = Math.sin(dl) * Math.cos(p2), x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

function moveLL(lat, lon, brgDeg, km) {
  const b = brgDeg * DEG;

}

const pad2 = n => (n < 10 ? '0' : '') + n;
function fmtClock(sec, withSec) {
  sec = ((sec % 86400) + 86400) % 86400;
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);

/* ---------- camera rig: pan / orbit / zoom with glide and follow ---------- */
class Rig {
  constructor(camera, o) {
    this.cam = camera; this.o = o;
    this.t = V3(); this.dist = o.dist || 100; this.az = o.az || 0; this.tilt = o.tilt || 50;
    this.gt = V3(); this.gdist = this.dist; this.gaz = this.az; this.gtilt = this.tilt;
    this.follow = null; this.groundY = 0;
  }
  goto(t, dist, az, tilt, snap) {
    if (t) this.gt.copy(t); if (dist != null) this.gdist = dist; if (az != null) this.gaz = az; if (tilt != null) this.gtilt = tilt;
    this.clampGoal();
    if (snap) { this.t.copy(this.gt); this.dist = this.gdist; this.az = this.gaz; this.tilt = this.gtilt; }
  }
  clampGoal() { const o = this.o; this.gdist = clamp(this.gdist, o.minDist, o.maxDist); this.gtilt = clamp(this.gtilt, o.minTilt, o.maxTilt);
    if (o.bounds) { this.gt.x = clamp(this.gt.x, o.bounds[0], o.bounds[1]); this.gt.z = clamp(this.gt.z, o.bounds[2], o.bounds[3]); } }
  pan(dx, dy) {            // screen pixels
    const k = this.dist * 2 * Math.tan(this.cam.fov * DEG / 2) / this.cam.viewH;
    const a = this.az * DEG, sx = Math.cos(a), sz = Math.sin(a), f = 1 / Math.max(0.35, Math.sin(this.tilt * DEG));
    this.gt.x -= (dx * sx - dy * sz * f) * k; this.gt.z -= (dx * sz + dy * sx * f) * k; this.follow = null; this.clampGoal();
  }
  orbit(dx, dy) { this.gaz -= dx * 0.28; this.gtilt += dy * 0.22; this.clampGoal(); }
  zoom(f) { this.gdist *= f; this.clampGoal(); }
  update(dt) {
    if (this.follow) { const p = this.follow(); if (p) this.gt.copy(p); }
    const k = 1 - Math.exp(-dt * (this.follow ? 6 : 5.5)), kz = 1 - Math.exp(-dt * 5);
    this.t.lerp(this.gt, k); this.dist = lerp(this.dist, this.gdist, kz);
    this.az += wrap180(this.gaz - this.az) * kz; this.tilt = lerp(this.tilt, this.gtilt, kz);
    const a = this.az * DEG, e = this.tilt * DEG, c = this.cam;
    c.position.set(this.t.x - Math.sin(a) * Math.cos(e) * this.dist, this.t.y + Math.sin(e) * this.dist, this.t.z + Math.cos(a) * Math.cos(e) * this.dist);
    if (c.position.y < this.groundY + 1.2) c.position.y = this.groundY + 1.2;
    c.lookAt(this.t);
  }
}

/* ---------- HTML labels pinned to 3D points ---------- */
class Labels {
  constructor(el) { this.el = el; this.map = new Map(); this.v = V3(); }
  get(key, cls, html) {
    let l = this.map.get(key);
    if (!l) { const d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); if (html != null) d.innerHTML = html; this.el.appendChild(d); l = { d, html, on: true, cls }; this.map.set(key, l); }
    return l;
  }
  text(key, html) { const l = this.map.get(key); if (l && l.html !== html) { l.html = html; l.d.innerHTML = html; } }
  place(key, p, cam, W, H, show, dy) {
    const l = this.map.get(key); if (!l) return;
    let on = show !== false;
    if (on) { this.v.copy(p).project(cam); on = this.v.z < 1 && this.v.z > -1 && Math.abs(this.v.x) < 1.15 && Math.abs(this.v.y) < 1.15; }
    if (on !== l.on) { l.on = on; l.d.style.display = on ? '' : 'none'; }
    if (on) { l.x = (this.v.x * 0.5 + 0.5) * W; l.y = (-this.v.y * 0.5 + 0.5) * H + (dy || 0); l.d.style.transform = 'translate3d(' + l.x.toFixed(1) + 'px,' + l.y.toFixed(1) + 'px,0)'; }
  }
  hideAll() { for (const l of this.map.values()) if (l.on) { l.on = false; l.d.style.display = 'none'; } }
  remove(key) { const l = this.map.get(key); if (l) { l.d.remove(); this.map.delete(key); } }
  clear() { for (const l of this.map.values()) l.d.remove(); this.map.clear(); }
}

function disposeTree(obj) {
  obj.traverse(o => {
    if (o.geometry && !Object.values(GC).includes(o.geometry)) o.geometry.dispose();
    const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    for (const m of ms) { if (Object.values(MAT).includes(m)) continue; for (const k of ['map', 'bumpMap', 'emissiveMap', 'alphaMap']) if (m[k] && m[k].dispose) m[k].dispose(); m.dispose(); }
  });
}

/* ===== 50-map.js ===== */
/* ============================================================================
   NETWORK MAP — peninsular India as a relief model at true horizontal scale
   (1 scene unit = 1 km). Coast, state lines, rivers, cities and airports are
   Natural Earth 1:10m; relief, land colour and night lights are NASA-derived.
   Corridors, sites and aircraft are placed by latitude and longitude.
   ========================================================================== */

const MAPC = { lat: 15.3, lon: 77.0, relief: 11, altEx: 14 };     // projection centre; km of height per unit DEM; altitude exaggeration
const mapX = lon => (lon - MAPC.lon) * KM_LON * Math.cos(MAPC.lat * DEG);
const mapZ = lat => -(lat - MAPC.lat) * KM_LAT;

/* constant-screen-width ribbon: `side` pushes each vertex sideways in clip space */
const RIB_VS = `
attribute vec3 next; attribute float side; attribute float along;
uniform vec2 res; uniform float width;
varying float vAlong; varying float vSide;
void main(){
  vec4 a = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  vec4 b = projectionMatrix * modelViewMatrix * vec4(next, 1.0);
  vec2 d = normalize((b.xy / max(b.w, 1e-4) - a.xy / max(a.w, 1e-4)) * res + vec2(1e-5));
  vec2 n = vec2(-d.y, d.x);
  a.xy += n * side * width / res * a.w;
  vAlong = along; vSide = side; gl_Position = a;
}`;
const RIB_FS = `
uniform vec3 color; uniform float opacity; uniform float time; uniform float dash; uniform float flow;
varying float vAlong; varying float vSide;
void main(){

function railing(parent, pts, y, h, color) {
  const pos = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    for (const k of [0.5, 1]) pos.push(a[0], y + h * k, a[1], b[0], y + h * k, b[1]);
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(L / 2));

}

  /* where every airframe is right now */

    const want = SCENARIOS.filter(s => this.inScope(s.id)).reduce((n, s) => n + sim._active(s.id).want, 0);

/* ===== 80-live.js ===== */
/* ============================================================================
   THE RECORD — one continuous operation. Day 1 is 12 Oct 2026 from 06:00 IST.
   The simulation runs at whatever speed is chosen and is never reset: the
   state is saved every minute (and when the page is hidden or closed), and the
   next time the page opens it continues exactly from where it was saved.
   With the artifact's database, one open tab holds a short lease and is the
   one that runs and saves; other open tabs follow its saves. Each closed day is
   archived (totals and every leg flown). Without the database the record is kept
   in this browser only.
   ========================================================================== */

const REC = { saveEveryS: 60, leaseMs: 120000, followEveryS: 60, chunk: 120000, localKey: 'logixair-twin-record-v' + 3 };

class Live {
  constructor(app) {
    this.app = app; this.sim = app.sim; this.db = null; this.tab = Math.random().toString(36).slice(2, 10);
    this.writer = false; this.ver = null; this.slot = null; this.lastSave = 0; this.savedAt = null; this.archived = -1; this.status = 'starting';
    this.busy = false; this.lastFollow = 0; this.speed = null;
  }
  async _db() {
    if (this.db !== null) return this.db;
    try { this.db = (window.claude && window.claude.use) ? await Promise.race([window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 12000))]) : null; } catch (e) { this.db = null; }
    if (!this.db) this.db = false;
    return this.db;
  }
  /* newest saved state from the database, or from this browser */
  async _load() {
    const db = await this._db();
    if (db) {
      try {
        const m = await db.doc('live/meta').get();
        if (m.exists && m.data().v === SNAP_V) {
          const meta = m.data(), parts = [];
          for (let i = 0; i < meta.n; i++) { const c = await db.doc('snap/' + meta.slot + i).get(); if (!c.exists || c.data().ver !== meta.ver) return null; parts.push(c.data().s); }
          this.archived = meta.archived != null ? meta.archived : -1;
          return { meta, snap: JSON.parse(parts.join('')) };
        }
      } catch (e) { console.warn('record could not be read', e); }
      return null;
    }
    try { const s = localStorage.getItem(REC.localKey); if (s) { const o = JSON.parse(s); return { meta: o.meta, snap: o.snap }; } } catch (e) { /* storage blocked */ }
    return null;
  }
  /* page start: continue the saved record, or begin day 1 */
  async boot(say) {
    if (say) say('OPENING THE RECORD …');
    const got = await this._load();
    if (got) {
      this.sim.restore(got.snap); this.ver = got.meta.ver; this.slot = got.meta.slot; this.savedAt = got.meta.savedAt;
      if (got.meta.speed != null) this.speed = got.meta.speed;
      this.status = 'resumed';
    } else {
      this.sim.warmUp(15 * 3600 + 40 * 60, 5);                 // first opening: day 1 from 06:00, flown up to the afternoon
      this.status = (await this._db()) ? 'new record' : 'this browser only';
    }
  }
  /* background: hold the lease and save; or follow the tab that holds it */
  async loop() {
    const db = await this._db();
    const run = async () => {
      if (this.busy) return;
      try {
        if (db) {
          let r = { acquired: false }; try { r = await db.doc('live/lease').acquire({ holder: this.tab, ttlMs: REC.leaseMs }); } catch (e) { r = { acquired: false }; }
          this.writer = !!r.acquired;
        } else this.writer = true;
        if (this.writer) { if (Date.now() - this.lastSave >= REC.saveEveryS * 1000 - 500) await this.save(); this.status = 'recording'; }
        else if (Date.now() - this.lastFollow >= REC.followEveryS * 1000 - 500) { this.lastFollow = Date.now(); await this.follow(); this.status = 'following'; }
      } catch (e) { this.status = 'record unavailable'; console.warn(e); }
    };
    await run(); setInterval(run, 15000);
    const flush = () => { if (this.writer) this.save().catch(() => 0); };
    document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
    window.addEventListener('pagehide', flush);
  }
  async save() {
    if (this.busy) return; this.busy = true;
    try {
      const db = await this._db(), snap = this.sim.snapshot(), savedAt = new Date().toISOString(), speed = this.app.paused ? 0 : this.app.speed;
      if (db) {
        const js = JSON.stringify(snap), ver = Date.now().toString(36) + '-' + this.tab, slot = this.slot === 'A' ? 'B' : 'A', n = Math.ceil(js.length / REC.chunk);
        for (let i = 0; i < n; i++) await db.doc('snap/' + slot + i).set({ ver, i, s: js.slice(i * REC.chunk, (i + 1) * REC.chunk) });
        await this.archive(db);
        await db.doc('live/meta').set({ v: SNAP_V, ver, slot, n, t: this.sim.t, day: dayOf(this.sim.t), savedAt, archived: this.archived, speed });
        this.ver = ver; this.slot = slot;
      } else {
        try { localStorage.setItem(REC.localKey, JSON.stringify({ meta: { t: this.sim.t, savedAt, speed }, snap })); } catch (e) { this.status = 'not saved · storage full or blocked'; }
      }
      this.lastSave = Date.now(); this.savedAt = savedAt;
    } finally { this.busy = false; }
  }
  /* closed days: totals per line, and every leg flown that day */
  async archive(db) {
    for (const d of this.sim.days) {
      if (d.day <= this.archived) continue;
      const legs = [];
      for (const a of this.sim.aircraft) for (const e of a.hist || []) if (e.k === 'L' && e.t >= d.t0 && e.t < d.t0 + 86400) legs.push([a.cs, Math.round(e.t), e.a ? Math.round(e.a) : null, e.f, e.to, e.r, e.kg || 0, e.ty || '', e.rev || 0, e.late || 0, e.mro || 0]);
      await db.doc('days/d' + (d.day + 1)).set({ day: d.day + 1, date: dateOf(d.t0), tot: d.tot, scn: d.scn });
      await db.doc('legs/d' + (d.day + 1)).set({ day: d.day + 1, cols: ['cs', 'dep', 'arr', 'from', 'to', 'route', 'kg', 'type', 'rev', 'late', 'mro'], legs });
      this.archived = d.day;
    }
  }
  /* a second open tab shows the record the running tab saved */
  async follow() {
    const db = await this._db(); if (!db) return;
    const m = await db.doc('live/meta').get(); if (!m.exists || m.data().ver === this.ver) return;
    const got = await this._load(); if (!got) return;
    this.sim.restore(got.snap); this.ver = got.meta.ver; this.slot = got.meta.slot; this.savedAt = got.meta.savedAt;
    if (got.meta.speed != null && got.meta.speed > 0) { this.app.speed = got.meta.speed; this.app.paused = false; } else if (got.meta.speed === 0) this.app.paused = true;
    this.app.ui.refresh();
  }
  label() {
    const s = this.status, t = this.savedAt ? new Date(this.savedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : null;
    return s === 'recording' ? 'SAVED ' + (t || '—') + ' YOUR TIME' : s === 'following' ? 'FOLLOWING ANOTHER OPEN TAB' : s.toUpperCase();
  }
}
